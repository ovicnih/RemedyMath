name: mp_musyaffailhamaka
description: >-
  RemediMath - Asisten Remediasi Matematika SMA Adaptif berbasis Item Response
  Theory (Model Rasch 1PL) dan Knowledge Graph prasyarat materi.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # Ikon bawaan Cupertino (dipakai pada widget bawaan Flutter).
  cupertino_icons: ^1.0.8

  # State management global (AppController).
  provider: ^6.1.2

  # Penyimpanan lokal profil, riwayat tes, dan video yang ditonton.
  shared_preferences: ^2.3.2

  # Membuka video penjelasan YouTube (FR-09).
  url_launcher: ^6.3.0

  # Format tanggal berbahasa Indonesia.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Aturan lint yang diaktifkan di `analysis_options.yaml`.
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/

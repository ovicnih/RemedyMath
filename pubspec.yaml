name: remedy_math
description: >-
  RemedyMath - Asisten Remediasi Matematika SMA Adaptif berbasis Item Response
  Theory (Model Rasch 1PL) dan Knowledge Graph prasyarat materi.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # Ikon bawaan Cupertino (dipakai pada widget bawaan Flutter).
  cupertino_icons: ^1.0.8

  # State management global (AppController).
  provider: ^6.1.2

  # Penyimpanan lokal profil, riwayat tes, dan konsep yang dipelajari.
  shared_preferences: ^2.3.2

  # Format tanggal berbahasa Indonesia.
  intl: ^0.19.0
  image_picker: ^1.2.0
  youtube_player_iframe: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Aturan lint yang diaktifkan di `analysis_options.yaml`.
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/

  # Font Inter (SIL Open Font License 1.1) — di-bundle supaya rendering
  # sama persis di semua perangkat, termasuk Android yang stock tidak punya
  # Inter dan akan jatuh ke Roboto bila font tidak di-bundle.
  #
  # Hanya empat weight yang perlu: Regular sebagai jaring pengaman untuk
  # weight bawaan Material, lalu 500/700/900 sesuai token neobrutalism.
  # Tidak ada italic karena tidak dipakai di desain.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
